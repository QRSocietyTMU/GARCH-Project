[project]
name = "garch-project"
version = "0.1.0"
description = "Walk-forward GARCH volatility forecasting for USD FX pairs"
requires-python = ">=3.13"
dependencies = [
    "arch>=9.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
